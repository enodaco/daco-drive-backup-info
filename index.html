<h1>Daco Drive Backup</h1>
<p>這是供帳戶擁有者個人使用的電腦備份工具。工具在擁有者的 Windows 電腦上執行，使用 rclone 將選定的本機資料，單向備份至擁有者自己的 Google Drive。</p>
<p>這個網站只有公開的工具說明，不提供檔案上傳、登入、資料查詢或備份內容瀏覽服務。</p>
<p>Google Drive 授權範圍採用 <code>drive.file</code>，僅存取本工具建立或獲明確授權的檔案。工作檔案與 Git 歷史備份由本機工具處理；備份內容不會發布到本網站。</p>
<p><a href="privacy.html">隱私權說明</a> · <a href="https://rclone.org/">rclone 官方網站</a></p>
<small>個人使用工具，不對外提供註冊或商業服務。</small>
